[project]
name = "data-science"
version = "0.1.0"
description = "Modelagem de atributos de linhas espectrais (ML) a partir dos espectros/datasets gerados por data_eng."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "spectra-hitran",
    "scikit-learn>=1.5",
    "torch>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convolutional_autoencoder"]

[tool.uv.sources]
spectra-hitran = { workspace = true }
