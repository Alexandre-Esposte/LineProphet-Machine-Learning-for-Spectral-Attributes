train: C:\Users\alexa\OneDrive\Área de Trabalho\LineProphet-Machine-Learning-for-Spectral-Attributes\database\train
valid: C:\Users\alexa\OneDrive\Área de Trabalho\LineProphet-Machine-Learning-for-Spectral-Attributes\database\valid
test: C:\Users\alexa\OneDrive\Área de Trabalho\LineProphet-Machine-Learning-for-Spectral-Attributes\database\test
configs_path: C:\Users\alexa\OneDrive\Área de Trabalho\LineProphet-Machine-Learning-for-Spectral-Attributes\data_science\scripts\train\train_configs.yaml
save_model_path: C:\Users\alexa\OneDrive\Área de Trabalho\LineProphet-Machine-Learning-for-Spectral-Attributes\data_science\trained_models\

#Atributos dataloader
batch_size: 16
num_workers: 4

# Atributos para treinamento
learning_rate: 0.001
epochs: 10

# Ruído (data augmentation), em absorbância: desvio sorteado log-uniforme
# em [noise_std_min, noise_std_max] por espectro (iguais = desvio fixo)
noise_std_min: 0.001
noise_std_max: 0.02

# Linha de base (data augmentation): soma offset + inclinação aleatórios só na
# entrada; offset em [-offset_max, offset_max] e rampa de ponta a ponta em
# [-slope_max, slope_max] (absorbância), com probabilidade p
baseline_shift: {p: 0.5, offset_max: 0.1, slope_max: 0.05}

# Contaminação sintética (data augmentation): soma linhas pseudo-Voigt aleatórias só na
# entrada, para o modelo aprender a ignorar linhas que não são da molécula. Com prob. p,
# n_lines uniforme; com prob. cluster_p as linhas ficam agrupadas numa sub-região (banda)
# de largura log-uniforme (cm⁻¹). Larguras HWHM (cm⁻¹) e altura relativa ao maior pico
# do espectro são log-uniformes
contamination:
  p: 0.5
  n_lines_min: 1
  n_lines_max: 150
  cluster_p: 0.5
  cluster_width_min: 20
  cluster_width_max: 200
  lorentz_hwhm_min: 0.005
  lorentz_hwhm_max: 0.3
  gauss_hwhm_min: 0.003
  gauss_hwhm_max: 0.02
  rel_height_min: 0.01
  rel_height_max: 1.5

# Loss de treino (absorption_loss; validação e teste usam sempre o MSE puro, para comparar configs):
#   alpha: peso do pico, 1 + alpha * A/max(A) por espectro (0 = sem peso)
#   delta: peso da penalidade de absorbância prevista negativa (0 = desligada)
loss: {alpha: 5, delta: 0}

# Máscara (data augmentation): zera janelas da absorção e acrescenta um 3º canal
# de entrada (1 = apagado). Com mask_channel: true, o 1º bloco da arquitetura
# precisa de in_channels: 3. mask_p: 0 mantém o canal (sempre zero) sem mascarar
mask_channel: true
mask_p: 0.5
# Tamanho das janelas em pontos (~0.01 cm-1 por ponto; linhas do HCl a ~2000 pontos)
mask_min_size: 500
mask_max_size: 2000
mask_n_windows: 2

# Arquitetura do modelo => (in_channels, out_channels, kernel_size_max_pooling, kernel_size_conv, num_layers)
latent_space: 16
pooling_output_size: 8192  


model_architecture:
  - {in_channels: 3,  out_channels: 4,  kernel_size_max_pooling: 2, kernel_size_conv: 3, num_layers: 1}
  - {in_channels: 4,  out_channels: 8, kernel_size_max_pooling: 2, kernel_size_conv: 3, num_layers: 1}



