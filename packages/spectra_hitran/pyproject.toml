[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-hitran"
version = "0.1.0"
description = "Biblioteca núcleo sobre HITRAN/HAPI: download de linhas, simulação de espectros, detecção de linhas e ajuste de perfis de Voigt."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hitran-api==1.3.0.0",
    "ipykernel>=7.3.0",
    "lmfit==1.3.4",
    "matplotlib==3.11.1",
    "nbformat>=5.11.1",
    "numpy==2.5.2",
    "optuna==4.9.0",
    "pandas==3.0.5",
    "plotly>=7.0.0",
    "scipy==1.18.0",
    "seaborn==0.13.2",
]

[tool.setuptools.packages]
find = { where = ["src"] }  # Procura pacotes dentro de src/

[dependency-groups]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::SyntaxWarning:hapi",
]
